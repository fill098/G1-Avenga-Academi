<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>CountrySearch 🌍</title>
    <style>
      .card-img-top {
        height: 200px;
        object-fit: cover;
      }
    </style>
  </head>

  <body>
    <nav class="navbar bg-secondary border-bottom border-body">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 text-white">🌍 County.Pedia</span>
      </div>
    </nav>

    <div class="container mt-5">
      <h1 class="text-dark text-center">Welcome to our site! Search for a country info</h1>
    </div>

    <div class="container mt-5 p-5">
      <div class="row">
        <div class="col-12">
          <div class="input-group">
            <input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="Recipient’s username"
              aria-label="Recipient’s username with two button addons"
            />
            <button class="btn btn-outline-secondary" type="button" id="searchBtn">Search</button>
            <button class="btn btn-outline-secondary" type="button" id="resetBtn">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <div class="row mt-3">
            <div class="col-12 d-flex gap-2 justify-content-center flex-wrap">
                <button class="btn btn-info" id="europeBtn">🇪🇺 All Countries in Europe</button>
                <button class="btn btn-warning" id="macedoniaNeighborsBtn">🗺️ Macedonia's Neighbors</button>
                <button class="btn btn-success" id="macedoniaBtn">🇲🇰 Get Macedonia</button>
            </div>
        </div>
    </div>

    <div class="container">
      <div class="row" id="resultsContainer"></div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./app.js"></script>
  </body>
</html>
