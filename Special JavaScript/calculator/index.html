<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standard Calculator</title>
    <link rel="stylesheet" href="./style.css" type="text/css" />
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="display-value" id="display">0</div>
        </div>
        <div class="buttons">
            <button class="clear" onclick="handleClear()">C</button>
            <button class="operator" onclick="handleOperation('÷')">÷</button>
            <button class="operator" onclick="handleOperation('×')">×</button>
            
            <button class="num" onclick="handleNumber('7')">7</button>
            <button class="num" onclick="handleNumber('8')">8</button>
            <button class="num" onclick="handleNumber('9')">9</button>
            <button class="operator" onclick="handleOperation('-')">-</button>
            
            <button class="num" onclick="handleNumber('4')">4</button>
            <button class="num" onclick="handleNumber('5')">5</button>
            <button class="num" onclick="handleNumber('6')">6</button>
            <button class="operator" onclick="handleOperation('+')">+</button>
            
            <button class="num" onclick="handleNumber('1')">1</button>
            <button class="num" onclick="handleNumber('2')">2</button>
            <button class="num" onclick="handleNumber('3')">3</button>
            <button class="equals" onclick="handleEquals()">=</button>
            
            <button class="num zero" onclick="handleNumber('0')">0</button>
            <button class="num" onclick="handleDecimal()">.</button>
        </div>
    </div>

<script src="./script.js"></script>
</body>
</html>
