<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Name List</h1>
    <ul id="nameList"></ul>
    <br />
    <button id="btn">Click me!</button>
    <br />
    <br />
    <h1>Registry page</h1>
    <form action="test" method="get" id="form">
      <label for="firstName">First name:</label>
      <input type="text" name="firstName" id="input-firstname" />
      <label for="lastName">Last name:</label>
      <input type="text" name="lastnName" id="input-lastname" />
      <label for="age">Age:</label>
      <input type="number" name="age" id="input-age" />
      <label for="email">Email:</label>
      <input type="email" name="email" id="input-email" />
      <button type="submit" id="btn2">Generator Students</button>
    </form>
    <br />
    <br />
    <h1>Movies renting App</h1>

    <input type="text" id="input-move" placeholder="Enter movie name" />
    <button id="btn3">Search</button>
    <h1 id="result2"></h1>

    <br />
    <br />

    <h1>Remander App</h1>

    <input type="text" placeholder="Title" id="title" />
    <div>
      <label>
        <input type="radio" name="priority" value="High" id="priority" />
        High
      </label>
      <label>
        <input type="radio" name="priority" value="Moderate" />
        Moderate
      </label>
      <label>
        <input type="radio" name="priority" value="Low" />
        Low
      </label>
    </div>
    <input type="color" placeholder="Color" id="color" />
    <textarea placeholder="Description" id="description"></textarea>
    <button type="button" id="btn4">Adding the reminder</button>
    <button type="button" id="btn5">Showing the reminder</button>

    <table id="table-id">
      <thead>
        <tr>
          <th>Title</th>
          <th>Priority</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody id="tbody-id"></tbody>
    </table>

    <br />
    <script src="studentConstructor.js"></script>
    <script src="listGenerator.js"></script>
    <script src="registryPage.js"></script>
    <script src="movis.js"></script>
    <script src="remainderApp.js"></script>
  </body>
</html>
